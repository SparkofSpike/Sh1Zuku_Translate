<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Pixiv Novel Translator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 13px;
      color: #222;
      background: #fafafa;
    }
    h2 {
      font-size: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 12px;
      color: #555;
    }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
    }
    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checkbox-field input[type="checkbox"] {
      width: auto;
    }
    .model-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .model-row select {
      flex: 1;
      min-width: 0;
    }
    .think-check {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      font-size: 12px;
      color: #444;
      margin: 0;
      white-space: nowrap;
      cursor: pointer;
    }
    .think-check input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    .presets-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .presets-group .preset-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #444;
      background: #f9f9f9;
      padding: 4px 10px;
      border-radius: 14px;
      border: 1px solid #eee;
      cursor: pointer;
    }
    .presets-group .preset-item:hover {
      background: #f0f0f0;
    }
    .presets-group .preset-item input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    .presets-loading {
      font-size: 12px;
      color: #999;
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #1a1a1a;
      color: #fff;
    }
    .btn-primary:hover {
      background: #444;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #eee;
      color: #333;
    }
    .btn-secondary:hover {
      background: #ddd;
    }
    .btn + .btn {
      margin-top: 8px;
    }
    .status {
      margin: 10px 0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status-ok {
      display: block;
      background: #e6f4ea;
      color: #1e7e34;
    }
    .status-err {
      display: block;
      background: #fce8e6;
      color: #c5221f;
    }
    .settings-toggle {
      width: 100%;
      margin: 0 0 10px;
      padding: 7px;
      border: 1px dashed #ccc;
      border-radius: 6px;
      background: transparent;
      color: #777;
      font-size: 12px;
      cursor: pointer;
    }
    .settings-toggle:hover {
      border-color: #999;
      color: #333;
      background: #f5f5f5;
    }
    .settings-panel {
      display: none;
    }
    .update-btn {
      margin-top: 8px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .submit-log-btn {
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fdba74;
    }
    .log-info {
      margin-top: 6px;
      font-size: 11px;
      color: #999;
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: #999;
    }
    .update-status {
      margin-top: 6px;
      font-size: 11px;
      line-height: 1.4;
    }
    .update-status .new { color: #1a73e8; font-weight: 600; }
    .update-status .ok { color: #1e7e34; }
    .update-status .err { color: #c5221f; }
    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 14px 0;
    }
  </style>
</head>
<body>
  <h2>Pixiv 小说翻译</h2>

  <!-- 首次配置：后端地址 + API Key + 目标语言直接展示；
       已配置后折叠到“设置”，点击展开 -->
  <button class="settings-toggle" id="settingsToggle" style="display:none;">设置</button>
  <div class="settings-panel" id="settingsPanel">
    <div class="field">
      <label for="backendUrl">后端地址</label>
      <input type="text" id="backendUrl" placeholder="https://example.com" />
    </div>
    <div class="field">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-xxxxxxxx..." />
    </div>
    <div class="field">
      <label for="targetLang">目标语言</label>
      <select id="targetLang">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ko">한국어</option>
      </select>
    </div>
  </div>

  <!-- 常用项：模型 + 思考（同行复选框）、显示模式、预设、Prompt、自动翻译 -->
  <div class="field">
    <div class="model-row">
      <select id="model">
        <option value="deepseek-v4-flash">deepseek-v4-flash</option>
        <option value="deepseek-v4-pro">deepseek-v4-pro</option>
      </select>
      <label class="think-check"><input type="checkbox" id="thinking" /> 思考</label>
    </div>
    <div id="modelStatus" style="margin-top:4px;color:#999;font-size:11px;"></div>
  </div>

  <div class="field">
    <label for="displayMode">显示模式</label>
    <select id="displayMode">
      <option value="inline" selected>原文内嵌对照（当前页）</option>
      <option value="panel">侧边面板</option>
      <option value="inline-full">原文内嵌对照（全文自动）</option>
      <option value="paged">分页模式（保留 [newpage]）</option>
    </select>
  </div>

  <div class="field">
    <label>附加预设（可多选）</label>
    <div id="presetsGroup" class="presets-group">
      <span class="presets-loading">加载中...</span>
    </div>
  </div>

  <div class="field">
    <label for="customPrompt">自定义附加 Prompt（可选）</label>
    <textarea id="customPrompt" rows="3"></textarea>
  </div>

  <div class="field checkbox-field">
    <input type="checkbox" id="autoTranslate" checked />
    <label for="autoTranslate" style="display:inline;font-weight:400;">自动翻译</label>
  </div>

  <div class="status" id="pageStatus"></div>
  <div class="status" id="status"></div>

  <button class="btn btn-primary" id="translateBtn">翻译当前小说</button>
  <button class="btn btn-secondary" id="retranslateBtn">重新翻译</button>
  <button class="btn btn-secondary" id="historyBtn">查看翻译历史</button>
  <button class="btn btn-secondary" id="saveBtn">保存设置</button>

  <hr />
  <div class="footer">
    公开小说无需登录 Pixiv；受限小说需先登录<br />
    后端地址需可公网访问<br />
    <span id="extVersion"></span><br />
    <span>后台每 6 小时自动检查</span><br />
    <button class="btn btn-secondary update-btn" id="updateBtn">检查更新</button>
    <div id="updateStatus" class="update-status"></div>
  </div>

  <hr />
  <button class="btn btn-secondary submit-log-btn" id="submitLogBtn">提交错误日志</button>
  <div id="logInfo" class="log-info"></div>

  <script src="version.js"></script>
  <script src="popup.js"></script>
</body>
</html>
