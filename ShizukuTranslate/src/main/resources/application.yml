        - kind: person
          note: 昵称。日语原文是促音「ヤッチョ」，与正名「ヤチヨ」仅差一个促音，必须分开
          terms:
            ja: ヤッチョ
            zh-CN: 小八
            ko: 얏쵸
            vi: Yaccho
        - kind: person
          terms:
