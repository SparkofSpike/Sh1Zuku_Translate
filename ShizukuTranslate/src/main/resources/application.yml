server:
  port: 5566

spring:
  datasource:
    url: jdbc:h2:file:./data/translatordb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    hikari:
      # Explicit rather than implicit. These match HikariCP's defaults and exist to pin the
      # intent: a request must not hold a pooled JDBC connection any longer than the SQL it
      # runs. Exhausting this pool is what produced
      # "HikariPool-1 - Connection is not available, request timed out after 30000ms"
      # in production, which surfaced to Safari users as "Load failed".
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 10000
      # Sentinel: logs a stack trace if a connection is ever held longer than this. Expect one
      # line per restart from the startup migration transaction (HistoricalUsageMigrationService),
      # which legitimately holds a connection for its whole run; anything else is a real bug.
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # Must stay false. With it enabled Spring binds an EntityManager to the whole request and
    # the connection it acquired is only released when the request finishes, so a long upstream
    # model call pins a pooled connection for minutes instead of milliseconds.
    #
    # Measured locally with three concurrent 15 s translations against a 3-connection pool:
    #   open-in-view=on, transactional HTTP: 3 connections held 15 s each, pool active=1 idle=0,
    #                                         a 4th request failed with 500 / "Connection is not
    #                                         available, request timed out"
    #   open-in-view=on, HTTP untransacted:  still held ~15 s (the borrow just moved from
    #                                        doBegin to the first query) - so splitting the
    #                                        transaction alone is NOT enough
    #   open-in-view=off:                    pool stayed idle=3 and the 4th request succeeded
    # Lazy association reads that open-in-view used to cover are now fetched explicitly
    # (AiModelProfileRepository uses @EntityGraph; AnnouncementService and SurveyService carry
    # read-only transactions).
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  mvc:
    async:
      # Full-novel SSE streams can run several minutes (DeepSeek pre-fill
      # + long output); 30 min leaves plenty of headroom.
      request-timeout: 1800000
  servlet:
    multipart:
      max-file-size: 20MB
      # Multi-image uploads arrive in one request (the web UI sends up to 10 pages at
      # once), so this must exceed max-file-size rather than equal it.
      max-request-size: 60MB

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com/v1
    default-model: deepseek-flash
    # Supported site models: deepseek-flash (DeepSeek-V4.1-Flash, natively multimodal) and
    # deepseek-v4-pro. The retired names deepseek-v4-flash and deepseek-v4-flash-vision-exp
    # still resolve, but the API serves them with V4.1 Flash.
    # DeepSeek v4 thinking mode: enabled=AI 推理（慢 ~6x）/ disabled=关闭（快），插件可请求级覆盖
    thinking-type: disabled

app:
  jwt:
    # No production fallback: JwtTokenProvider rejects blank or known weak secrets.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:shizuku-translate}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mail:
    # SMTP settings for email verification codes. Leave host blank to disable
    # email sending; registration / email verification then fail with a clear
    # "mail service not configured" error. Production fills these through
    # environment variables in the scheduled-task launcher script.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    ssl: ${MAIL_SSL:true}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:5566,chrome-extension://*}
  stream:
    core-pool-size: ${STREAM_CORE_POOL_SIZE:4}
    max-pool-size: ${STREAM_MAX_POOL_SIZE:16}
    queue-capacity: ${STREAM_QUEUE_CAPACITY:64}

  # ── Translation quality feedback pipeline ─────────────────────────────────
  # Samples + behaviour events are appended as UTC-dated JSONL files under
  # `dir`; the admin UI reads them back and tools/export_feedback.py exports
  # them. Text is redacted (e-mail / phone / ID / card / URL query / mention +
  # `redaction.extra-terms`) in the writer thread, strictly before anything is
  # persisted. `sample-rate` keeps ordinary traffic; dissatisfaction signals
  # (rating <= 3, re-translate, edit) keep the whole sample regardless.
  feedback:
    enabled: ${FEEDBACK_ENABLED:true}
    sample-rate: ${FEEDBACK_SAMPLE_RATE:0.02}
    daily-sample-cap: ${FEEDBACK_DAILY_CAP:5000}
    pending-cache-size: ${FEEDBACK_PENDING_SIZE:5000}
    pending-ttl-minutes: ${FEEDBACK_PENDING_TTL_MINUTES:1440}
    queue-capacity: ${FEEDBACK_QUEUE_CAPACITY:20000}
    dir: ${FEEDBACK_DIR:./data/feedback}
    max-pending-text-chars: 20000
    max-stored-text-chars: 50000
    redaction:
      enabled: true
      extra-terms: []
  admin-usernames:
    - shizuku
    - Shizuku

  # ── Pixiv import ───────────────────────────────────────────────────────────
  # session-cookie is the PHPSESSID of a (dedicated) Pixiv account whose settings
  # have R-18 display enabled. With it set, the importer can fetch login-gated
  # (R-18) novels and the search endpoint returns R-18 results; without it only
  # public works are importable. The value is only ever sent to pixiv.net.
  pixiv:
    session-cookie: ${PIXIV_SESSION_COOKIE:}

  # ── Target languages ────────────────────────────────────────────────────────
  # Clients send `targetLanguage` on a translate request. An unknown or missing
  # value falls back to `default-target-language`, so existing callers (and the
  # browser extension) keep translating into Chinese without any change.
  # Adding a language is a config change, not a code change.
  translation:
    default-target-language: zh-CN
    # `prompt-notes` is appended to the system prompt only when that language is the target.
    # Language-specific conventions (honorifics, pronoun systems, register) belong here; putting
    # them in the shared prompt is what previously made a Japanese-specific rule apply to every
    # target language.
    target-languages:
      - code: zh-CN
        label: 简体中文
        prompt-notes: "称谓处理：保留日式特有的称谓习惯，如「桑」「酱」「大人」等。"
      - code: vi
        label: Tiếng Việt
        # TODO(native review): Vietnamese personal pronouns are chosen as a mirror pair from the
        # speakers' relationship, age gap and gender (if one side says `em`, the other is `anh`
        # or `chị`); `tôi`/`bạn` belong to strangers, formal settings and narration only.
        # The concrete relationship -> pronoun mapping still needs a native speaker, so this is
        # deliberately left empty rather than guessed.
        prompt-notes: ""
      - code: en
        label: English
        prompt-notes: ""

  # ── Glossary seed data ──────────────────────────────────────────────────────
  # Seeded into glossary_concepts / glossary_terms on first startup, per series,
  # and only when that series has no concepts yet — the database is the runtime
  # source of truth afterwards, so later admin edits survive a restart.
  #
  # `series` matches a preset name: selecting that preset in the UI injects these
  # terms, rendered into whichever target language the request asked for.
  #
  # NOTE on the vi column: Japanese proper nouns are NOT rendered with
  # Sino-Vietnamese readings — Vietnamese readers use the romanised name as-is
  # (Iroha, Kaguya, Yachiyo). The values below are Hepburn romanisation and still
  # need a native reviewer's pass; entries we have no confident romanisation for
  # are intentionally left blank, which makes them fall back to model judgement.
  glossary:
    - series: 超时空辉夜姬！
      # TODO(native review): character-to-character forms of address for this work. Example
      # raised by a Vietnamese reader: here Iroha and Yachiyo address each other as equals,
      # even though their ages would normally call for a senior/junior register - something a
      # model cannot infer from the text and must be told. Needs the actual Vietnamese pronouns
      # before it can be filled in.
      notes: ""
      concepts:
        - kind: work
          terms:
            ja: "超かぐや姫!"
            zh-CN: 超时空辉夜姬！
        - kind: term
          note: 保持原样，不要翻译
          terms:
            ja: localTime of PC
            zh-CN: localTime of PC
        - kind: person
          terms:
            ja: かぐや
            zh-CN: 辉夜
            ko: 카구야
            vi: Kaguya
        - kind: person
          note: 全名
