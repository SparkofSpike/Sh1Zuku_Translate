            zh-CN: 酒寄彩叶
            vi: Sakayori Iroha
        - kind: person
          terms:
            ja: 酒寄
            zh-CN: 酒寄
            ko: 사카요리
            vi: Sakayori
        - kind: person
          terms:
            ja: 彩葉
            zh-CN: 彩叶
            ko: 이로하
