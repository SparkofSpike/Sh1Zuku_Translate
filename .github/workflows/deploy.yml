name: Build & Deploy

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ShizukuTranslate-frontend/package-lock.json

      - name: Build frontend
        run: |
          cd ShizukuTranslate-frontend
          npm ci && npm run build

      - name: Copy to backend static
        run: |
          rm -rf ShizukuTranslate/src/main/resources/static
          mkdir -p ShizukuTranslate/src/main/resources/static
          cp -r ShizukuTranslate-frontend/dist/* ShizukuTranslate/src/main/resources/static/

      - name: Build backend
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - run: |
          cd ShizukuTranslate
          mvn clean package -DskipTests
          cp target/*.jar target/translator.jar

      - name: Package
        run: |
          mkdir -p deploy_package/logs
          cp ShizukuTranslate/target/translator.jar deploy_package/
          cp -r ocr-worker deploy_package/
          rm -rf deploy_package/ocr-worker/venv deploy_package/ocr-worker/.venv deploy_package/ocr-worker/__pycache__
          cp .github/workflows/deploy.ps1 deploy_package/
          # Compress jar to speed up transfer
          gzip -k deploy_package/translator.jar

      - name: Deploy ocr-worker + scripts (small files)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy_package/ocr-worker,deploy_package/deploy.ps1,deploy_package/logs
          target: ${{ secrets.SERVER_PATH }}
          strip_components: 1

      - name: Deploy jar (compressed)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy_package/translator.jar.gz
          target: ${{ secrets.SERVER_PATH }}

      - name: Decompress and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /d D:\Sh1ZukuTranslate
            gzip -d -f translator.jar.gz 2>nul
            taskkill /f /im java.exe 2>nul
            taskkill /f /im python.exe 2>nul
            timeout /t 3 /nobreak >nul
            start /B python ocr-worker\ocr_server.py > logs\ocr.log 2>&1
            timeout /t 5 /nobreak >nul
            start /B java -jar translator.jar > logs\backend.log 2>&1
