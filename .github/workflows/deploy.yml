name: Build

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ShizukuTranslate-frontend/package-lock.json

      - name: Build frontend
        run: |
          cd ShizukuTranslate-frontend
          npm ci && npm run build

      - name: Copy to backend static
        run: |
          rm -rf ShizukuTranslate/src/main/resources/static
          mkdir -p ShizukuTranslate/src/main/resources/static
          cp -r ShizukuTranslate-frontend/dist/* ShizukuTranslate/src/main/resources/static/

      - name: Build backend
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - run: |
          cd ShizukuTranslate
          mvn clean package -DskipTests
          cp target/*.jar target/translator.jar

      - name: Package
        run: |
          mkdir -p deploy_package/logs
          cp ShizukuTranslate/target/translator.jar deploy_package/
          cp -r ocr-worker deploy_package/
          rm -rf deploy_package/ocr-worker/venv deploy_package/ocr-worker/.venv deploy_package/ocr-worker/__pycache__
          cp .github/workflows/deploy.ps1 deploy_package/

      - name: Deploy
        env:
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          PORT: ${{ secrets.SERVER_PORT }}
          USER: ${{ secrets.SERVER_USER }}
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts || echo "KEYS_FAILED but continuing"
          rsync -avz --delete -e "ssh -v -p ${PORT} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes" \
            deploy_package/ "${USER}@${HOST}:D:/Sh1ZukuTranslate/" 2>&1

      - name: Restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /d D:\Sh1ZukuTranslate
            taskkill /f /im java.exe 2>nul
            taskkill /f /im python.exe 2>nul
            timeout /t 3 /nobreak >nul
            start /B python ocr-worker\ocr_server.py > logs\ocr.log 2>&1
            timeout /t 5 /nobreak >nul
            start /B java -jar translator.jar > logs\backend.log 2>&1
