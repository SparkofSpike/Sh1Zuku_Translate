name: Build

on:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ===================== Checkout =====================
      - uses: actions/checkout@v4

      # ===================== Build Frontend =====================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ShizukuTranslate-frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd ShizukuTranslate-frontend
          npm ci

      - name: Build frontend
        run: |
          cd ShizukuTranslate-frontend
          npm run build

      # ===================== Copy to Backend Static =====================
      - name: Copy frontend dist to backend static
        run: |
          rm -rf ShizukuTranslate/src/main/resources/static
          mkdir -p ShizukuTranslate/src/main/resources/static
          cp -r ShizukuTranslate-frontend/dist/* ShizukuTranslate/src/main/resources/static/

      # ===================== Build Backend =====================
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend with Maven
        run: |
          cd ShizukuTranslate
          mvn clean package -DskipTests
          cp target/*.jar target/translator.jar

      # ===================== Package =====================
      - name: Package deploy files
        run: |
          mkdir -p deploy_package/logs
          cp ShizukuTranslate/target/translator.jar deploy_package/
          cp -r ocr-worker deploy_package/
          rm -rf deploy_package/ocr-worker/venv
          rm -rf deploy_package/ocr-worker/.venv
          rm -rf deploy_package/ocr-worker/__pycache__
          cp .github/workflows/deploy.ps1 deploy_package/
          zip -r deploy_package.zip deploy_package/

      # ===================== Upload Artifact =====================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-deploy
          path: deploy_package.zip
          retention-days: 7
