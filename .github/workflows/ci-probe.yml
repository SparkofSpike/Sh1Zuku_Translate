name: CI Probe (temporary)

# 临时连通性探测：验证 GitHub-hosted runner（海外）能否直连生产机的 SSH / HTTP 端口。
# 目的：判断能否把部署从"本地 ship.py"迁到 GitHub Actions。
# 目标地址通过 workflow_dispatch 输入传入，不写死在仓库里。用完即删。

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Target host (IP or domain) to probe'
        required: true
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner identity
        run: |
          echo "kernel: $(uname -srm)"
          echo "--- runner egress IP ---"
          curl -sS -m 15 https://ipinfo.io/json || echo "(ipinfo unavailable)"
          echo

      - name: TCP reachability
        run: |
          HOST="${{ inputs.host }}"
          for PORT in 22 80 5566 5557; do
            printf '%-22s -> ' "$HOST:$PORT"
            if timeout 12 bash -c "exec 3<>/dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo OPEN
            else
              echo "CLOSED / TIMEOUT"
            fi
          done

      - name: SSH banner
        run: |
          HOST="${{ inputs.host }}"
          echo "--- ssh banner ---"
          timeout 12 bash -c "exec 3<>/dev/tcp/$HOST/22; head -c 80 <&3" || echo "(no banner)"
          echo

      - name: HTTP latency from runner
        run: |
          HOST="${{ inputs.host }}"
          for i in 1 2 3; do
            curl -sS -o /dev/null \
              -w "attempt$i connect=%{time_connect}s ttfb=%{time_starttransfer}s total=%{time_total}s code=%{http_code}\n" \
              -m 25 "http://$HOST/" || echo "attempt$i failed"
          done
          echo "--- /api/v1/presets (first 200 bytes) ---"
          curl -sS -m 25 "http://$HOST/api/v1/presets" | head -c 200 || echo "(failed)"
          echo

      - name: Upload throughput sample (10 MB from server)
        run: |
          HOST="${{ inputs.host }}"
          # 前端主 bundle 约 150KB；这里用首页资源估算下载速度
          curl -sS -o /dev/null -w "index.html: %{size_download}B in %{time_total}s = %{speed_download}B/s\n" \
            -m 30 "http://$HOST/" || true
